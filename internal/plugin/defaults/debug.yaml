name: debug
description: Analyze error messages and suggest fixes with reasoning
prompt_template: |
  Analyze the following error or bug report. Provide:
  1. Root cause - what is likely going wrong and why
  2. Fix - concrete steps or code changes to resolve it
  3. Prevention - how to avoid this in the future

  Be specific and actionable. If the error message is ambiguous,
  list the most likely causes in order of probability.

  Error or bug report:
  {{.Input}}
